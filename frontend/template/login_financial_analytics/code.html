<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md">
<!-- Login Container -->
<main class="w-full max-w-md">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight flex items-center justify-center gap-sm">
<span aria-hidden="true" class="material-symbols-outlined fill-icon text-secondary">analytics</span>
                Financial Analytics
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Secure access to professional market insights.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-xl">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div class="space-y-xs">
<label class="block font-label-mono text-label-mono text-on-surface uppercase" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded focus:ring-2 focus:ring-secondary focus:border-secondary focus:outline-none transition-shadow" id="email" name="email" placeholder="professional@firm.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex items-center justify-between">
<label class="block font-label-mono text-label-mono text-on-surface uppercase" for="password">Password</label>
<a class="font-label-mono text-label-mono text-secondary hover:text-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded focus:ring-2 focus:ring-secondary focus:border-secondary focus:outline-none transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-secondary focus:ring-secondary border-outline-variant rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember this device for 30 days
                    </label>
</div>
<!-- Actions -->
<div>
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded font-label-mono text-label-mono uppercase text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors duration-150" type="submit">
                        Sign In
                    </button>
</div>
</form>
<div class="mt-lg border-t border-outline-variant pt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Need an enterprise account? <a class="font-headline-sm text-[14px] text-secondary hover:text-secondary-container transition-colors" href="#">Contact Sales</a>
</p>
</div>
</div>
<!-- Footer -->
<footer class="mt-xl text-center">
<p class="font-label-mono text-label-mono text-outline uppercase">© 2024 Financial Analytics Platform. All rights reserved.</p>
</footer>
</main>
</body></html>
